<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — Page not found</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305080b'/%3E%3Ctext x='32' y='43' font-family='monospace' font-size='30' fill='%234dff91' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=43">
<style>
  /* Standalone page: the site's shell isn't loaded here, so the few bits of
     layout it needs live inline rather than pulling in script.js. */
  .nf-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
  .nf-card{max-width:560px;width:100%;padding:38px;border:1px solid var(--line);
    border-radius:14px;background:var(--card-bg)}
  .nf-code{font:12px ui-monospace,monospace;color:var(--accent);letter-spacing:.08em}
  .nf-card h1{font-size:clamp(30px,5vw,46px);font-weight:500;letter-spacing:-1.5px;margin:12px 0 14px}
  .nf-card p{color:var(--muted);line-height:1.7;margin:0 0 26px}
  .nf-actions{display:flex;flex-wrap:wrap;gap:12px}
  .nf-actions a{display:inline-flex;align-items:center;gap:8px;padding:11px 17px;border-radius:10px;
    border:1px solid var(--accent);color:var(--accent);text-decoration:none;font:13px ui-monospace,monospace;transition:.2s}
  .nf-actions a:hover{background:var(--accent);color:var(--bg)}
  .nf-actions a.ghost{border-color:var(--line);color:var(--muted)}
  .nf-actions a.ghost:hover{background:var(--tile-hover);color:var(--text)}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="nf-wrap">
    <div class="nf-card">
      <div class="nf-code">// ERROR 404 — ROUTE NOT FOUND</div>
      <h1>This page doesn't exist.</h1>
      <p>The link may be out of date, or the address might have a typo in it. Everything else is still where you left it.</p>
      <div class="nf-actions">
        <a href="/">← Back to the portfolio</a>
        <a class="ghost" href="/#projects">See the projects</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
