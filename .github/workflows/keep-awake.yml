name: keep-awake
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keep-awake
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check website and database
        env:
          TARGET: ${{ vars.KEEP_AWAKE_URL || 'https://johndaleverthechanova.com/api/health/db' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            --connect-timeout 15 --max-time 90 \
            --retry 1 --retry-delay 5 --retry-all-errors \
            "$TARGET" -o /tmp/portfolio-health.json
          python3 - <<'PY'
          import json
          with open('/tmp/portfolio-health.json') as stream:
              body = json.load(stream)
          if body.get('status') != 'ok':
              raise SystemExit('Health check failed: inspect Render and database status.')
          print('Website and database responded successfully.')
          PY
